      <tspan x="28" y="399.5" opacity="0">       ...;$@+@@@@@@$$$$@@@@@*^&amp;$ $$:...<animate attributeName="opacity" to="1" begin="0.88s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="413" opacity="0">  ...--.:$$ $$$$@$@@@*#####@$$ $S$$::--;:+.<animate attributeName="opacity" to="1" begin="0.91s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="426.5" opacity="0">   ..-=:$$ @@@@@@@@@@@$$$#$$$$$$S==;:-;,...<animate attributeName="opacity" to="1" begin="0.95s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="440" opacity="0">  ...-::$$# @@@@@@@@@@@@@$$S++$$;==--:y,...<animate attributeName="opacity" to="1" begin="0.98s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="453.5" opacity="0">  ...-:$$#. $@@@@@@@@@@@@@@$S.$$$#j;---:-...,<animate attributeName="opacity" to="1" begin="1.02s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="467" opacity="0">  ...---:$$4. @@@@@@@@@@@@@@@@# .$$#8};---=y---<animate attributeName="opacity" to="1" begin="1.05s" dur="0.15s" fill="freeze"/></tspan>
