<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#2563eb; #06b6d4; #10b981; #2563eb" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#06b6d4; #2563eb; #0284c7; #06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7; #2563eb; #0d9488; #0284c7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb; #0d9488; #0284c7; #2563eb" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669; #0284c7; #2563eb; #059669" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="activePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#0284c7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <style>
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, monospace;
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinking-cursor {
        animation: cursorBlink 0.9s infinite;
      }
      @keyframes statusGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .status-dot {
        animation: statusGlow 2s infinite ease-in-out;
      }
      @keyframes type1 {
        0%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
        2%, 22% { opacity: 1; clip-path: inset(0 0% 0 0); }
        24% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes type2 {
        0%, 25% { opacity: 0; clip-path: inset(0 100% 0 0); }
        27%, 47% { opacity: 1; clip-path: inset(0 0% 0 0); }
        49% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes type3 {
        0%, 50% { opacity: 0; clip-path: inset(0 100% 0 0); }
        52%, 72% { opacity: 1; clip-path: inset(0 0% 0 0); }
        74% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes type4 {
        0%, 75% { opacity: 0; clip-path: inset(0 100% 0 0); }
        77%, 97% { opacity: 1; clip-path: inset(0 0% 0 0); }
        99% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      .typed-1 { animation: type1 16s infinite steps(28, end); }
      .typed-2 { animation: type2 16s infinite steps(24, end); }
      .typed-3 { animation: type3 16s infinite steps(30, end); }
      .typed-4 { animation: type4 16s infinite steps(26, end); }
      @keyframes particleFloat {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      .particle-1 { animation: particleFloat 6s infinite ease-in-out; }
      .particle-2 { animation: particleFloat 9s infinite ease-in-out 2s; }
      .particle-3 { animation: particleFloat 7s infinite ease-in-out 4s; }
      .pill { transition: all 0.3s ease; }
      .pill:hover { fill: #e2e8f0; stroke: #0284c7; filter: drop-shadow(0 0 6px rgba(2, 132, 199, 0.3)); }
    </style>
  </defs>

