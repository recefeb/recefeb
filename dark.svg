      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="6s" repeatCount="indefinite" />
      <text class="font-mono ascii-gradient" font-size="10.5" font-weight="500" letter-spacing="0">
      <tspan x="28" y="62" opacity="0">                  ..----./;<animate attributeName="opacity" to="1" begin="0.00s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="75.5" opacity="0">            ,-:==&gt;!## \$,/$|.+<animate attributeName="opacity" to="1" begin="0.04s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="89" opacity="0">         i##::+/'!$@f,';/  '/ `;/2<animate attributeName="opacity" to="1" begin="0.07s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="102.5" opacity="0">        f@$|\{### //     |.-7/   /\\...,-<animate attributeName="opacity" to="1" begin="0.11s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="116" opacity="0">       ./`'$\ \   '| i   \'      |/`<animate attributeName="opacity" to="1" begin="0.14s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="129.5" opacity="0">      $$ \  .    \   !         ;<animate attributeName="opacity" to="1" begin="0.18s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="143" opacity="0">     '$:    + = &amp;lt;-   **   \    '    .$"<animate attributeName="opacity" to="1" begin="0.21s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="156.5" opacity="0">     :$      ++@@@@@@@@$&amp;n i%         ;<animate attributeName="opacity" to="1" begin="0.25s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="170" opacity="0">     ;$* -:@@$:........$@@@@@@S$$$$&amp;+ ;<animate attributeName="opacity" to="1" begin="0.28s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="183.5" opacity="0">     7!$@$S...          .$$$$$S@$@@@@~ %<animate attributeName="opacity" to="1" begin="0.32s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="197" opacity="0">      /@$S...----6%!,...$@@@-@@~--*$$%<animate attributeName="opacity" to="1" begin="0.35s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="210.5" opacity="0">      '$$$--:$@@@@@@@@--$0'- ----...$|<animate attributeName="opacity" to="1" begin="0.39s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="224" opacity="0">      $$$==,..==--=%...:$$:--*****@@$+/;<animate attributeName="opacity" to="1" begin="0.42s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="237.5" opacity="0">      +$$--*===$ /-+::...$$ \  /  *@$<animate attributeName="opacity" to="1" begin="0.46s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="251" opacity="0">      @$$-----$$$,?$----$$$$. -=#$$$$ =<animate attributeName="opacity" to="1" begin="0.49s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="264.5" opacity="0">       l$...------...$$$$$$$$$@@@@@@i|<animate attributeName="opacity" to="1" begin="0.53s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="278" opacity="0">       l$...............$$$$'@@@@@@@@+<animate attributeName="opacity" to="1" begin="0.56s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="291.5" opacity="0">       l$.....,......;==+.@@@@@@@@@@@@<animate attributeName="opacity" to="1" begin="0.60s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="305" opacity="0">        $........--!;^$#++'B@@@@@@@@<animate attributeName="opacity" to="1" begin="0.63s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="318.5" opacity="0">        $........  .t;$000 .#@@@@@@@@<animate attributeName="opacity" to="1" begin="0.67s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="332" opacity="0">        $......$$$$@@@@@@#@@@@@@@@<animate attributeName="opacity" to="1" begin="0.70s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="28" y="345.5" opacity="0">         .....z$+=-==*@8*= "*@@@@@@@<animate attributeName="opacity" to="1" begin="0.74s" dur="0.15s" fill="freeze"/></tspan>
