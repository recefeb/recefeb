<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      
      .title-gradient { fill: url(#accentGradient); }
      .ascii-gradient { fill: url(#asciiGradient); }
      .border-shimmer { stroke: url(#shimmerGradient); }
    </style>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #22D3EE; #10B981; #7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE; #10B981; #7C3AED; #22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981; #7C3AED; #22D3EE; #10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="asciiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE; #7C3AED; #10B981; #22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #10B981; #22D3EE; #7C3AED" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6">
        <animate attributeName="stop-opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6">
        <animate attributeName="stop-opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1180" height="610" rx="20" fill="#030712" />
  <rect width="1180" height="610" rx="20" fill="url(#cyberGrid)" opacity="0.6" />

  <circle cx="250" cy="180" r="320" fill="url(#bgGlow1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; 0,0" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="920" cy="450" r="350" fill="url(#bgGlow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,30; 0,0" dur="14s" repeatCount="indefinite" />
  </circle>

  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" class="border-shimmer" stroke-width="1.5" />

  <!-- LEFT SIDE: ASCII TERMINAL CARD -->
  <g transform="translate(32, 32)" filter="url(#cardShadow)">
