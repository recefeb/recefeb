      <tspan x="50" y="352" opacity="0">%@@@@@@@@@@@@@%%%%%%%<animate attributeName="opacity" to="1" begin="0.80s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="366" opacity="0">%%@@@@@@@@@@@@%%%%%%%<animate attributeName="opacity" to="1" begin="0.84s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="380" opacity="0">@@@@@@@@@@%%%@%<animate attributeName="opacity" to="1" begin="0.88s" dur="0.15s" fill="freeze"/></tspan>
