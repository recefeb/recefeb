      <tspan x="50" y="464" opacity="0">#####################<animate attributeName="opacity" to="1" begin="1.12s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="478" opacity="0">#######################<animate attributeName="opacity" to="1" begin="1.16s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="492" opacity="0">###########################<animate attributeName="opacity" to="1" begin="1.20s" dur="0.15s" fill="freeze"/></tspan>
