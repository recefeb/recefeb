      <tspan x="50" y="72" opacity="0">@@@@@@@@@@@@@<animate attributeName="opacity" to="1" begin="0.00s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="86" opacity="0">%%%%@@@@@@@@@<animate attributeName="opacity" to="1" begin="0.04s" dur="0.15s" fill="freeze"/></tspan>
      <tspan x="50" y="100" opacity="0">@@@@@@@@@@@@@<animate attributeName="opacity" to="1" begin="0.08s" dur="0.15s" fill="freeze"/></tspan>
