<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Name Cyan Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Highlighted Skill Pill Gradient -->
    <linearGradient id="activePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Scanline effect for Left Terminal -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#38bdf8" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Terminal Animations */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: cursorBlink 1s infinite;
    }

    @keyframes statusGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .status-dot {
      animation: statusGlow 2s infinite ease-in-out;
    }

    /* Skill Pill Hover Style */
    .pill {
      transition: all 0.3s ease;
    }
    .pill:hover {
      fill: #1e293b;
      stroke: #38bdf8;
    }
  </style>

  <!-- Base Outer Container Card -->
  <rect x="2" y="2" width="846" height="436" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Grid Background Pattern Overlay (Subtle) -->
  <g opacity="0.05">
    <path d="M0 40 H850 M0 80 H850 M0 120 H850 M0 160 H850 M0 200 H850 M0 240 H850 M0 280 H850 M0 320 H850 M0 360 H850 M0 400 H850" stroke="#38bdf8" stroke-width="0.5"/>
    <path d="M40 0 V440 M80 0 V440 M120 0 V440 M160 0 V440 M200 0 V440 M240 0 V440 M280 0 V440 M320 0 V440 M360 0 V440 M400 0 V440 M440 0 V440 M480 0 V440 M520 0 V440 M560 0 V440 M600 0 V440 M640 0 V440 M680 0 V440 M720 0 V440 M760 0 V440 M800 0 V440" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- LEFT TERMINAL WINDOW (ASCII PORTRAIT) -->
  <g id="left-terminal">
    <!-- Window Frame -->
    <rect x="20" y="20" width="390" height="400" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M20 32 A12 12 0 0 1 32 20 H398 A12 12 0 0 1 410 20 V54 H20 Z" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Titlebar Buttons -->
    <circle cx="38" cy="37" r="5" fill="#ff5f56"/>
    <circle cx="53" cy="37" r="5" fill="#ffbd2e"/>
    <circle cx="68" cy="37" r="5" fill="#27c93f"/>
    
    <!-- Window Title -->
    <text x="215" y="41" text-anchor="middle" fill="#64748b" class="font-mono" font-size="11.5" font-weight="500">recep@dev: ~/portrait</text>

    <!-- Terminal Interior Background -->
    <rect x="21" y="55" width="388" height="364" fill="#060911" rx="0"/>
    <rect x="21" y="55" width="388" height="364" fill="url(#scanlines)" rx="0"/>

    <!-- ASCII Face Portrait Content -->
    <g class="font-mono" font-size="8.8px" letter-spacing="0.5px">
      <text x="32" y="78" fill="#38bdf8" opacity="0.4">              ~                            </text>
      <text x="32" y="88" fill="#38bdf8" opacity="0.6">  -----::-;!?JY58#GSYSG+!:;'------         </text>
      <text x="32" y="98" fill="#38bdf8" opacity="0.8">  ---;?YYJ5SSG&amp;@@$&amp;#&amp;#$$BGS;'-::--         </text>
      <text x="32" y="108" fill="#38bdf8">  --~S88G&amp;&amp;#8@$$$$@&amp;#@$$$@@&amp;5Y5S+-         </text>
      <text x="32" y="118" fill="#38bdf8">  -J5GB#&amp;&amp;$@&amp;$$$$$$@@$$$$$$$$$@#Y:         </text>
      <text x="32" y="128" fill="#7dd3fc">  -JG#$$$$#G88###@@&amp;$$$$$$$$$$@8!-         </text>
      <text x="32" y="138" fill="#7dd3fc">  ! ######';:- ##################~         </text>
      <text x="32" y="148" fill="#bae6fd">  !-### ?Y?++~!;-'. ############-!         </text>
      <text x="32" y="158" fill="#f0f9ff">  !~:##YGJ:.   .'''.############!!         </text>
      <text x="32" y="168" fill="#ffffff">  !!~ #58J~- # :;:.############;~!         </text>
      <text x="32" y="178" fill="#f0f9ff">  !!~-#SSJ!'###'YY.###########.~!!         </text>
      <text x="32" y="188" fill="#7dd3fc">  !!!:-GYJ?!###~YY.###########!!!!         </text>
      <text x="32" y="198" fill="#38bdf8">  !!!!JG5J?!;!J5YJ'###########~!!!         </text>
      <text x="32" y="208" fill="#38bdf8">  !!!;Y85Y+~!~JY5J-##########'~!!!         </text>
      <text x="32" y="218" fill="#38bdf8">  !!!;J8YYJ?!;?;:~'##########;!!!!         </text>
      <text x="32" y="228" fill="#38bdf8">  !!!!!Y5YY?+?+~! ##########-~!!!!         </text>
      <text x="32" y="238" fill="#38bdf8">  !!!!;?5YYY?!;:'###########!!!!!!         </text>
      <text x="32" y="248" fill="#60a5fa">  !!!!!!YYYJ!-''###########.~!!!!!         </text>
      <text x="32" y="258" fill="#60a5fa">  !!!!!!~JY+!+~- ##########!!!!!!!         </text>
      <text x="32" y="268" fill="#818cf8">  !!!!!;;J?~!~~;-.#########!!!!!!!         </text>
      <text x="32" y="278" fill="#818cf8">  ??+??YYJSY?++~:':-       ;++????         </text>
      <text x="32" y="288" fill="#38bdf8">  ?Y58#@+.55Y?~:-':-.      !~~~+++         </text>
      <text x="32" y="298" fill="#38bdf8"> G#@#B@S' ?5YYY+!-.       -J+~~~++         </text>
      <text x="32" y="308" fill="#38bdf8">SBBBB##&amp;B8&amp;J. '?YYYJ+:-''...  5J+;:!~~     </text>
      <text x="32" y="318" fill="#38bdf8">GG8BG8G#&amp;$#?:  :~??+~!;:---  5B??!;!;!     </text>
      <text x="32" y="328" fill="#38bdf8">B8 S#BG8&amp;$S++   -;!!!;;;:-  5$G??+!!;?  S S</text>
      <text x="32" y="338" fill="#38bdf8">#&amp;  8##G$$ ++!  .-:::;;!: .8$@S   ;;    88#</text>
      <text x="32" y="348" fill="#38bdf8">S@8  8B@$#  ++J! .-:--;!-!#$&amp;     ;;    8B@</text>
      <text x="32" y="358" fill="#38bdf8"> $@SSG#$$#8  J 8 :'--:!?8$$#       8 S8B&amp;$</text>
    </g>

    <!-- Bottom Status Line -->
    <line x1="30" y1="384" x2="400" y2="384" stroke="#1e293b" stroke-width="1"/>
    <circle cx="42" cy="398" r="3.5" fill="#22c55e" class="status-dot"/>
    <text x="52" y="401" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1px">STATUS: ACTIVE</text>
    <text x="390" y="401" text-anchor="end" fill="#64748b" class="font-mono" font-size="9.5">[HOLO-PORTRAIT V3.0]</text>
  </g>

  <!-- RIGHT TERMINAL WINDOW (BIO & SKILLS) -->
  <g id="right-terminal">
    <!-- Window Frame -->
    <rect x="430" y="20" width="400" height="400" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M430 32 A12 12 0 0 1 442 20 H818 A12 12 0 0 1 830 20 V54 H430 Z" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Titlebar Buttons -->
    <circle cx="448" cy="37" r="5" fill="#ff5f56"/>
    <circle cx="463" cy="37" r="5" fill="#ffbd2e"/>
    <circle cx="478" cy="37" r="5" fill="#27c93f"/>
    
    <!-- Window Title -->
    <text x="630" y="41" text-anchor="middle" fill="#64748b" class="font-mono" font-size="11.5" font-weight="500">recep ~ zsh - 120x34</text>

    <!-- Terminal Interior Background -->
    <rect x="431" y="55" width="398" height="364" fill="#060911" rx="0"/>

    <!-- Command Prompt 1 ($ whoami) -->
    <text x="452" y="86" fill="#38bdf8" class="font-mono" font-size="14" font-weight="700">$</text>
    <text x="468" y="86" fill="#f8fafc" class="font-mono" font-size="14" font-weight="600">whoami</text>

    <!-- Main Header Greeting: Hi 👋 I'm Recep Efe Bıçakçı -->
    <text x="452" y="124" class="font-mono">
      <tspan fill="#ffffff" font-size="22" font-weight="800">Hi </tspan>
      <tspan font-size="22">👋 </tspan>
      <tspan fill="#ffffff" font-size="22" font-weight="800">I'm </tspan>
      <tspan fill="url(#nameGrad)" font-size="22" font-weight="800">Recep Efe Bıçakçı</tspan>
    </text>

    <!-- Subtitle / Role Prompt with Cursor -->
    <g transform="translate(0, 156)">
      <text x="452" y="0" fill="#38bdf8" class="font-mono" font-size="14" font-weight="700">&gt;</text>
      <text x="472" y="0" fill="#38bdf8" class="font-mono" font-size="14" font-weight="500">C++ &amp; Computer Engineering Student</text>
      <rect x="768" y="-12" width="8" height="15" fill="#22d3ee" rx="1" class="blinking-cursor"/>
    </g>

    <!-- Dotted Divider Line -->
    <line x1="452" y1="176" x2="808" y2="176" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Metadata Information List -->
    <g class="font-mono" font-size="12.5px" transform="translate(0, 196)">
      <!-- Location -->
      <g transform="translate(0, 0)">
        <text x="452" y="0" fill="#38bdf8" font-weight="600">~/location</text>
        <text x="552" y="0" fill="#475569" font-weight="600">→</text>
        <text x="576" y="0" fill="#f8fafc" font-weight="500">Istanbul, Turkey</text>
        <text x="696" y="0" font-size="11">🇹🇷</text>
      </g>

      <!-- Education -->
      <g transform="translate(0, 24)">
        <text x="452" y="0" fill="#38bdf8" font-weight="600">~/education</text>
        <text x="552" y="0" fill="#475569" font-weight="600">→</text>
        <text x="576" y="0" fill="#f8fafc" font-weight="500">Computer Engineering Student</text>
        <text x="792" y="0" font-size="11">🎓</text>
      </g>

      <!-- Focus -->
      <g transform="translate(0, 48)">
        <text x="452" y="0" fill="#38bdf8" font-weight="600">~/focus</text>
        <text x="552" y="0" fill="#475569" font-weight="600">→</text>
        <text x="576" y="0" fill="#f8fafc" font-weight="500">C++ - C# - Algorithms - System Dev</text>
        <text x="806" y="0" font-size="11">⚡</text>
      </g>

      <!-- GitHub -->
      <g transform="translate(0, 72)">
        <text x="452" y="0" fill="#38bdf8" font-weight="600">~/github</text>
        <text x="552" y="0" fill="#475569" font-weight="600">→</text>
        <text x="576" y="0" fill="#38bdf8" font-weight="600">github.com/recefeb</text>
      </g>

      <!-- Email -->
      <g transform="translate(0, 96)">
        <text x="452" y="0" fill="#38bdf8" font-weight="600">~/email</text>
        <text x="552" y="0" fill="#475569" font-weight="600">→</text>
        <text x="576" y="0" fill="#f59e0b" font-weight="600">recefeb@gmail.com</text>
      </g>
    </g>

    <!-- Section Divider / Header: SKILLS & TECHNOLOGIES -->
    <g transform="translate(0, 324)">
      <text x="452" y="0" fill="#64748b" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.5px">SKILLS &amp; TECHNOLOGIES</text>
    </g>

    <!-- Skills Capsule Pills -->
    <g class="font-mono" font-size="11px" transform="translate(452, 336)">
      <!-- Row 1 Pills -->
      <!-- Pill 1: C++ (Active Highlight) -->
      <g class="pill" transform="translate(0, 0)">
        <rect x="0" y="0" width="58" height="24" rx="12" fill="url(#activePillGrad)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="29" y="16" text-anchor="middle" fill="#38bdf8" font-weight="700">C++</text>
      </g>

      <!-- Pill 2: C# -->
      <g class="pill" transform="translate(64, 0)">
        <rect x="0" y="0" width="50" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="25" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">C#</text>
      </g>

      <!-- Pill 3: Algorithms -->
      <g class="pill" transform="translate(120, 0)">
        <rect x="0" y="0" width="94" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="47" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">Algorithms</text>
      </g>

      <!-- Pill 4: Git / GitHub -->
      <g class="pill" transform="translate(220, 0)">
        <rect x="0" y="0" width="98" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="49" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">Git / GitHub</text>
      </g>

      <!-- Pill 5: Linux -->
      <g class="pill" transform="translate(324, 0)">
        <rect x="0" y="0" width="52" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="26" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">Linux</text>
      </g>

      <!-- Row 2 Pills -->
      <!-- Pill 6: Data Structures -->
      <g class="pill" transform="translate(0, 30)">
        <rect x="0" y="0" width="124" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="62" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">Data Structures</text>
      </g>

      <!-- Pill 7: OOP -->
      <g class="pill" transform="translate(130, 30)">
        <rect x="0" y="0" width="54" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="27" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">OOP</text>
      </g>

      <!-- Pill 8: Problem Solving -->
      <g class="pill" transform="translate(190, 30)">
        <rect x="0" y="0" width="118" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="59" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">Problem Solving</text>
      </g>

      <!-- Pill 9: AI Workflows -->
      <g class="pill" transform="translate(314, 30)">
        <rect x="0" y="0" width="62" height="24" rx="12" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>
        <text x="31" y="16" text-anchor="middle" fill="#94a3b8" font-weight="500">AI</text>
      </g>
    </g>

  </g>
</svg>
