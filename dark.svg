    <text x="210" y="24" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="12" font-weight="500">recep@dev: ~/portrait</text>
    
    <line x1="0" y1="40" x2="420" y2="40" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" />

