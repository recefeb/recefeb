      <text x="110" y="0" fill="#94A3B8" class="font-mono" font-size="11">[HOLO-PORTRAIT V3.0]</text>
      <rect x="270" y="-10" width="8" height="12" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

